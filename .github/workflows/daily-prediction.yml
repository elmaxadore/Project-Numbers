name: Daily Prediction Bot

on:
  schedule:
    # Runs every day at 08:00 UTC (adjust time as needed)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  predict-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Download Release Assets
        run: |
          # Create release-assets directory
          mkdir -p ./release-assets

          # Download the latest zip file from releases (don't hardcode version)
          echo "⬇️ Downloading latest model release from GitHub Releases..."
          LATEST_RELEASE=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          if [ -z "$LATEST_RELEASE" ]; then
            echo "❌ No releases found in this repository"
            exit 1
          fi
          echo "📦 Found latest release: $LATEST_RELEASE"
          
          gh release download "$LATEST_RELEASE" --repo ${{ github.repository }} --pattern "*.zip" --dir ./release-assets || {
            echo "❌ Failed to download release. Make sure a release exists with a .zip file."
            exit 1
          }
          
          # List what we downloaded
          echo "📂 Downloaded files:"
          ls -la ./release-assets
          
          # Unzip all zip files (handles multiple or nested zips)
          for zipfile in ./release-assets/*.zip; do
            if [ -f "$zipfile" ]; then
              echo "📦 Extracting $zipfile..."
              unzip -o "$zipfile" -d ./release-assets
            fi
          done
          
          echo "✅ Extraction complete. Verifying files:"
          ls -la ./release-assets/*.bin ./release-assets/*.json 2>/dev/null || {
            echo "⚠️ Some expected files (.bin or .json) not found after extraction"
            # Don't exit here - let the bot handle missing files with proper error
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Prediction Bot
        run: node dist/bot/telegram-bot.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: Paid API keys (bot works with free TheSportsDB if these are missing)
          X_RAPIDAPI_KEY: ${{ secrets.X_RAPIDAPI_KEY }}
          THE_ODDS_API: ${{ secrets.THE_ODDS_API }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
