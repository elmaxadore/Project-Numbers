name: Daily Multi-Sport Betting Analysis

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      send_telegram:
        description: 'Send results to Telegram (true/false)'
        required: false
        default: 'true'
      debug_mode:
        description: 'Enable debug logging (true/false)'
        required: false
        default: 'false'
      sports_filter:
        description: 'Sports: soccer,basketball,tennis,baseball,ice_hockey,american_football. Empty=all.'
        required: false
        default: ''

jobs:
  multi-sport-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Initialize Release Assets
        run: |
          mkdir -p ./release-assets
          echo '{}' > ./release-assets/all-sports-data.json
          echo 'placeholder' > ./release-assets/o25-ensemble.bin

      - name: Download Model Release (Optional)
        continue-on-error: true
        id: download-release
        run: |
          echo "⬇️ Downloading latest model release..."
          RELEASE_COUNT=$(gh release list --repo ${{ github.repository }} 2>/dev/null | wc -l || echo "0")
          if [ "$RELEASE_COUNT" -eq 0 ]; then
            echo "ℹ️ No releases found. Using fallback mode."
            echo "has_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          LATEST_RELEASE=$(gh release list --limit 1 --repo ${{ github.repository }} --json tagName --jq '.[0].tagName')
          if [ -z "$LATEST_RELEASE" ]; then
            echo "has_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          gh release download "$LATEST_RELEASE" --repo ${{ github.repository }} --dir ./release-assets || {
            echo "has_release=false" >> $GITHUB_OUTPUT
            exit 0
          }
          for zipfile in ./release-assets/*.zip; do
            [ -f "$zipfile" ] && unzip -o "$zipfile" -d ./release-assets
          done
          echo "✅ Release download complete"
          echo "has_release=true" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Multi-Sport Bot
        run: node dist/bot/telegram-bot.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TELEGRAM: ${{ github.event.inputs.send_telegram || 'true' }}
          DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}
          SPORTS_FILTER: ${{ github.event.inputs.sports_filter || '' }}
          X_RAPIDAPI_KEY: ${{ secrets.X_RAPIDAPI_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          THE_ODDS_API: ${{ secrets.THE_ODDS_API }}
          ODDS_PAPI_KEY: ${{ secrets.ODDS_PAPI_KEY }}

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: betting-analysis-${{ github.run_number }}
          path: |
            ./release-assets/*.json
            ./analysis-output.txt
            ./multi-sport-report.json
          retention-days: 7

      - name: Post Summary
        if: always()
        run: |
          echo "## 🌍 Multi-Sport Betting Analysis" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** ${{ github.run_number }} | **Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "./analysis-output.txt" ]; then
            echo "### 📊 Key Findings" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -80 ./analysis-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
