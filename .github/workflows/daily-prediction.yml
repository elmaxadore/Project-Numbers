name: Daily Prediction Bot

on:
  schedule:
    # Runs every day at 08:00 UTC (adjust time as needed)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  predict-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Download Release Assets
        run: |
          # Create release-assets directory
          mkdir -p ./release-assets

          # Download the zip file from releases
          echo "⬇️ Downloading model-release-v1.0.0.zip from GitHub Releases..."
          gh release download v1.0.0 --repo ${{ github.repository }} --pattern "*.zip" --dir ./release-assets || {
            echo "❌ Failed to download release. Make sure v1.0.0 exists with a .zip file."
            exit 1
          }
          
          # List what we downloaded
          echo "📂 Downloaded files:"
          ls -la ./release-assets
          
          # Unzip the model and data files
          if [ -f ./release-assets/model-release-v1.0.0.zip ]; then
            echo "📦 Extracting model and data..."
            unzip -o ./release-assets/model-release-v1.0.0.zip -d ./release-assets
            echo "✅ Extraction complete. Verifying files:"
            ls -la ./release-assets/*.bin ./release-assets/*.json 2>/dev/null || {
              echo "⚠️ Some expected files (.bin or .json) not found after extraction"
              exit 1
            }
          else
            echo "❌ Zip file not found in release-assets after download"
            ls -la ./release-assets
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Prediction Bot
        run: node dist/bot/telegram-bot.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
